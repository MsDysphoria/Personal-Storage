<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telemetry Player</title>
<style>
  body {
    background: #0a0a0a;
    margin: 0;
    padding: 2rem;
    font-family: monospace;
  }

  .dysphoria-telemetry-player {
    --dtp-bg: rgb(13 13 13 / 85%);
    --dtp-border: rgb(120 88 49 / 68%);
    --dtp-border-soft: rgb(120 88 49 / 34%);
    --dtp-text: rgb(196 181 169 / 86%);
    --dtp-text-soft: rgb(155 143 137 / 68%);
    --dtp-accent: rgb(244 190 148 / 86%);
    --dtp-accent-glow: rgb(159 71 17 / 55%);
    --dtp-hover: rgb(110 80 50 / 42%);
    --dtp-active: rgb(120 88 49 / 22%);
    
    --dtp-waveform-played: rgba(188, 111, 45, 0.75);
    --dtp-waveform-unplayed: rgba(218, 210, 202, 0.40);
    --dtp-waveform-center: rgba(218, 210, 202, 0.13);
    --dtp-waveform-cursor: rgba(255, 190, 91, 0.76);
    
    --dtp-osc-color: rgb(220, 190, 148);
    --dtp-osc-bg: rgba(50, 25, 10, 0.4);

    --dtp-bass-max-hz: 1;
    --dtp-glow-intensity: 0;
    --dtp-dynamic-glow: rgb(255 170 82 / calc(var(--dtp-glow-intensity) * 0.9));

    width: 100%;
    max-width: 640px;
    margin: 0 auto;
    box-sizing: border-box;
    padding: 0.8rem;
    background: linear-gradient(135deg, rgb(24 19 16 / 90%), rgb(8 8 8 / 94%));
    border: 1px solid var(--dtp-border);
    box-shadow: 
      inset 0 0 1.2rem rgb(0 0 0 / 50%),
      0 0.5rem 1rem rgb(0 0 0 / 70%);
    font-family: monospace;
    color: var(--dtp-text);
    display: grid;
    gap: 0.6rem;
    user-select: none;
    transition: box-shadow 50ms ease, border-color 50ms ease;
  }

  .dysphoria-telemetry-player * { box-sizing: border-box; }

  .dtp-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-bottom: 1px solid var(--dtp-border-soft);
    padding-bottom: 0.3rem;
    
    
  }

  .dtp-title {
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--dtp-accent);
    filter: drop-shadow(0 0 calc(var(--dtp-waveform-glow-intensity, var(--dtp-glow-intensity)) * 12px) var(--dtp-dynamic-glow));
    text-shadow: 0 0 8px var(--dtp-accent-glow);
  }

  .dtp-social-panel {
    display: flex;
    gap: 0.6rem;
    align-items: center;
  }

  .dtp-social-btn {
    width: 1.2rem;
    height: 1.2rem;
    cursor: pointer;
    fill: var(--dtp-text-soft);
    transition: fill 150ms ease, filter 150ms ease;
  }

  .dtp-social-btn:hover {
    fill: var(--dtp-accent);
    filter: drop-shadow(0 0 4px var(--dtp-accent-glow));
  }

  .dtp-main-display {
    position: relative;
    width: 100%;
    height: 8rem;
    background: var(--dtp-osc-bg);
    border: 1px solid var(--dtp-border-soft);
    box-shadow: inset 0 0 3rem rgb(0 0 0 / 100%), 0 2px 2.5px rgb(0 0 0 / 75%);
;
    overflow: hidden;
    
  }

  .dtp-main-display::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: 
      linear-gradient(90deg, rgb(244 190 148 / 4%) 0 1px, transparent 1px 100%),
      linear-gradient(0deg, rgb(244 190 148 / 4%) 0 1px, transparent 1px 100%);
    background-size: 1rem 1rem;
    mix-blend-mode: screen;
  }

  .dtp-status {
    position: absolute;
    top: 0.5rem;
    right: 0.5rem;
    z-index: 3;
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    color: var(--dtp-text-soft);
    background: rgba(0,0,0,0.5);
    padding: 0.2rem 0.4rem;
    border: 1px solid var(--dtp-border-soft);
  }

  .dtp-oscilloscope {
    position: absolute;
    inset: 0;
    mix-blend-mode: screen;
    
    opacity: 0.8;
    width: 100%;
    height: 100%;
    display: block;
    z-index: 1;
  }

  .dtp-overlay-text {
    position: absolute;
    bottom: 0.3rem;
    left: 0.4rem;
    right: 0.4rem;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    opacity: 0.75;
    z-index: 2;
    pointer-events: none;
  }

  .dtp-track-name {
    font-size: 0.75rem;
    color: var(--dtp-text);
    text-shadow: 1px 1px 0 rgb(0 0 0), 0 0 5px rgb(0 0 0);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 80%;
  }

  .dtp-track-name::before {
    content: "Ms. Dysphoria - ";
  }

  .dtp-time-data {
    font-size: 0.65rem;
    color: var(--dtp-accent);
    text-shadow: 1px 1px 0 rgb(0 0 0);
  }

  .dtp-waveform-panel {
    width: 100%;
    height: 3.6rem;
    background: rgb(0 0 0 / 40%);
    border: 1px solid var(--dtp-border-soft);
            box-shadow: 0 2px 2px rgb(0 0 0 / 75%);

    position: relative;
    overflow: hidden;
    cursor: pointer;

    transition: box-shadow 50ms ease;
  }

  .dtp-waveform-wrap {
    width: 100%;
    height: 100%;
    position: relative;
    touch-action: none;
  }

  .dtp-waveform {
    display: block;
    filter: drop-shadow(0 0 calc(var(--dtp-waveform-glow-intensity, var(--dtp-glow-intensity)) * 12px) var(--dtp-dynamic-glow));
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .dtp-waveform-hover-time {
    position: absolute;
    top: 0.15rem;
    left: 0;
    z-index: 3;
    padding: 0.06rem 0.28rem;
    background: rgb(0 0 0 / 42%);
    border: 1px solid rgb(218 178 136 / 22%);
    color: rgb(245 177 155 / 86%);
    font-size: 0.61rem;
    letter-spacing: 0.03em;
    font-variant-numeric: tabular-nums;
    opacity: 0;
    transform: translateX(-50%) translateY(-0.22rem);
    transition: opacity 120ms ease, transform 120ms ease;
    pointer-events: none;
  }

  .dtp-waveform-wrap.dtp-hovering .dtp-waveform-hover-time {
    opacity: 0.95;
    transform: translateX(-50%) translateY(0);
  }

  .dtp-controls {
    display: grid;
    grid-template-columns: auto auto 1fr;
    gap: 0.5rem;
    align-items: center;
  }

  .dtp-btn {
    height: 2rem;
    background: linear-gradient(180deg, rgb(27 23 20), rgb(8 8 8));
    border: 1px solid var(--dtp-border-soft);
    color: var(--dtp-text-soft);
    font-family: inherit;
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    cursor: pointer;
    padding: 0 1rem;
    transition: all 150ms ease;
    box-shadow: 0 1.5px 2px rgb(0 0 0 / 100%);
    
  }

  .dtp-btn:hover {
    border-color: var(--dtp-accent);
    color: var(--dtp-accent);
    background: var(--dtp-hover);
    box-shadow: 0 0 10px var(--dtp-accent-glow);
  }

  .dtp-play-btn {
    width: 3rem;
    padding: 0;
    
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .dtp-icon-play {
    display: block;
    width: 0;
    height: 0;
    border-top: 0.4rem solid transparent;
    border-bottom: 0.4rem solid transparent;
    border-left: 0.6rem solid var(--dtp-text-soft);
    transform: translateX(2px);
    transition: all 150ms ease;
  }

  .dtp-play-btn:hover .dtp-icon-play { border-left-color: var(--dtp-accent); }

  .dtp-playing .dtp-icon-play {
    width: 0.6rem;
    height: 0.6rem;
    border: none;
    background: var(--dtp-accent);
    transform: none;
  }

  .dtp-volume-wrap {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 0.5rem;
  }

  .dtp-label {
    font-size: 0.65rem;
    color: var(--dtp-text-soft);
  }

  .dtp-slider {
    width: 5rem;
    height: 0.8rem;
    appearance: none;
    -webkit-appearance: none;
    background: transparent;
    cursor: pointer;
  }

  .dtp-slider::-webkit-slider-runnable-track {
    height: 2px;
    background: var(--dtp-border-soft);
  }

  .dtp-slider::-webkit-slider-thumb {
    appearance: none;
    width: 0.5rem;
    height: 0.8rem;
    background: var(--dtp-accent);
    margin-top: -0.35rem;
    border: 1px solid rgb(0 0 0);
    box-shadow: 0 0 calc(2px + var(--dtp-glow-intensity) * 10px) var(--dtp-dynamic-glow);
    transition: box-shadow 50ms ease;
  }

  .dtp-tracklist-container {
    height: 8rem;
    overflow-y: auto;
    border: 1px solid var(--dtp-border-soft);
    background: rgb(8 8 8 / 65%);
    scrollbar-width: thin;
    scrollbar-color: var(--dtp-border-soft) rgb(8 8 8);
                box-shadow: 0 2px 2px rgb(0 0 0 / 75%);

  }

  .dtp-tracklist {
    list-style: none;
    margin: 0;
    
    padding: 0;
  }

  .dtp-track-item {
    display: grid;
    grid-template-columns: 1fr 0.3fr 0.8fr 0.8fr auto;
    align-items: center;
    font-size: 0.6rem;
    color: var(--dtp-text-soft);
    cursor: pointer;
    transition: background 150ms ease, color 150ms ease;
    margin-bottom: 0.075rem;
        margin-top: 0.075rem;
  }


.dtp-track-item::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 4px;
  background: rgb(120 88 49 / 15%);
  pointer-events: none;
}
  .dtp-track-item span {
    padding: 0.4rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
        box-shadow: 0 2px 1px rgb(0 0 0 / 100%);
    border-right: 1px solid var(--dtp-border-soft);
  }

  .dtp-track-item span:last-child {
    border-right: none;
  }

  .dtp-track-item:hover {
    background: var(--dtp-hover);
    color: var(--dtp-text);
  }

  .dtp-track-item.dtp-active {
    background: var(--dtp-active);
    color: var(--dtp-accent);
    border-left: 2px solid var(--dtp-accent);
    text-shadow: 0 0 calc(var(--dtp-glow-intensity) * 12px) var(--dtp-dynamic-glow);
  }

  .dtp-track-album, .dtp-track-genre { color: var(--dtp-text-soft); }
  .dtp-track-length { font-family: monospace; color: var(--dtp-accent); }
  .dtp-track-status { text-align: right; color: var(--dtp-accent); }
</style>
</head>

    clearInterval(fadeTimer);
    audio.volume = parseFloat(this.value);
  });

  if (waveformWrap) {
    waveformWrap.addEventListener("pointerenter", function(event) {
      waveformWrap.classList.add("dtp-hovering");
      waveformHoverRatio = getPointerRatio(event);
      updateHoverTime(waveformHoverRatio, event.clientX);
    });

    waveformWrap.addEventListener("pointermove", function(event) {
      waveformHoverRatio = getPointerRatio(event);
      updateHoverTime(waveformHoverRatio, event.clientX);
      if (isPointerDown) seekToRatio(waveformHoverRatio);
    });

    waveformWrap.addEventListener("pointerleave", function() {
      if (!isPointerDown) waveformWrap.classList.remove("dtp-hovering");
    });

    waveformWrap.addEventListener("pointerdown", function(event) {
      isPointerDown = true;
      waveformWrap.classList.add("dtp-hovering");
      try { waveformWrap.setPointerCapture(event.pointerId); } catch(e) {}
      waveformHoverRatio = getPointerRatio(event);
      updateHoverTime(waveformHoverRatio, event.clientX);
      seekToRatio(waveformHoverRatio);
    });

    waveformWrap.addEventListener("pointerup", function(event) {
      isPointerDown = false;
      try { waveformWrap.releasePointerCapture(event.pointerId); } catch(e) {}
      requestWaveformDraw(true);
    });

    waveformWrap.addEventListener("pointercancel", function(event) {
      isPointerDown = false;
      waveformWrap.classList.remove("dtp-hovering");
      try { waveformWrap.releasePointerCapture(event.pointerId); } catch(e) {}
    });

    waveformWrap.addEventListener("keydown", function(event) {
      var key = event.key || event.code;
      var seekSeconds = 5;
      if (key === " " || key === "Space" || key === "Spacebar") {
        event.preventDefault();
        playBtn.click();
        return;
      }
      if (key === "ArrowLeft") {
        event.preventDefault();
        if (audio.duration) audio.currentTime = Math.max(0, audio.currentTime - seekSeconds);
        else pendingSeekRatio = Math.max(0, getProgressRatio() - 0.02);
        requestWaveformDraw(true);
        return;
      }
      if (key === "ArrowRight") {
        event.preventDefault();
        if (audio.duration) audio.currentTime = Math.min(audio.duration, audio.currentTime + seekSeconds);
        else pendingSeekRatio = Math.min(1, getProgressRatio() + 0.02);
        requestWaveformDraw(true);
        return;
      }
      if (key === "Home") { event.preventDefault(); seekToRatio(0); return; }
      if (key === "End") { event.preventDefault(); seekToRatio(1); }
    });
  }

  audio.volume = parseFloat(volSlider.value);
  window.addEventListener("resize", function() {
    resizeCanvas();
    updateColors();
    waveformCache.key = "";
    requestWaveformDraw(true);
  });

  updateColors();
  renderTracklist();
  generateSilentWaveform();
})();
</script>

</body>
