fadeGain: fadeGain,
dryGain: dryGain,
pannerGain: pannerGain,
panner: panner,
openSource: null,
lowSource: null,
active: true
};

connectDeckOutput(deck);
updateDeckPanning(deck, visualPosition.x, visualPosition.y, dataNumber("panning-dezipper-ms", 70));

deck.openSource = startLoopingSource(buffers.open, openGain, duration, offset, pitch);
deck.lowSource = startLoopingSource(buffers.low, lowGain, duration, offset, pitch);

decksByLayer[layer].push(deck);
layerDuration[layer] = duration;
return deck;
});
}

function stopDeck(deck, delayMs) {
if (!deck || !audioContext) return;

deck.active = false;

var delay = Math.max(0, delayMs || 0);

window.setTimeout(function () {
stopLoopingSource(deck.openSource);
stopLoopingSource(deck.lowSource);
try { deck.openGain.disconnect(); } catch (error) {}
try { deck.lowGain.disconnect(); } catch (error) {}
try { deck.layerGain.disconnect(); } catch (error) {}
try { if (deck.clickFilter) deck.clickFilter.disconnect(); } catch (error) {}
try { deck.fadeGain.disconnect(); } catch (error) {}
try { if (deck.panner) deck.panner.disconnect(); } catch (error) {}
}, delay);
}

function cleanupLayerDecks(layer, keepDeck) {
decksByLayer[layer] = decksByLayer[layer].filter(function (deck) {
if (deck === keepDeck) return true;
stopDeck(deck, 0);
return false;
});
}

function startInitialDecks() {
if (audioStarted) return Promise.resolve();

return Promise.all([
createDeck("top", currentItems.top, 1),
createDeck("bottom", currentItems.bottom, 1)
]).then(function () {
audioStarted = true;
});
}

function startAudio() {
var context = ensureAudioContext();
if (!context) return;

if (!isStarted) {
isStarted = true;
updateExternalAudioState();
startLoop();
}

resumeAudioContext();

if (audioStarted) return;

startInitialDecks();
}

function replaceLayer(layer, itemIndex) {
if (layer !== "top" && layer !== "bottom") return;

var otherLayer = layer === "top" ? "bottom" : "top";
itemIndex = clamp(Math.round(itemIndex), 1, 6);

if (itemIndex === currentItems[otherLayer]) return;
if (itemIndex === currentItems[layer]) return;

currentItems[layer] = itemIndex;
transitionToken[layer] += 1;
var token = transitionToken[layer];

applyLayerOverlay(layer, true);
updateSelectedButtons();
preloadCurrentItems();

if (!audioStarted) return;

createDeck(layer, itemIndex, 0).then(function (newDeck) {
if (!newDeck) return;

if (token !== transitionToken[layer]) {
stopDeck(newDeck, 0);
return;
}

var fadeMs = Math.max(20, dataNumber("item-crossfade-ms", 650));
rampAudioParam(newDeck.fadeGain.gain, 1, fadeMs);

decksByLayer[layer].forEach(function (deck) {
if (deck === newDeck) return;
rampAudioParam(deck.fadeGain.gain, 0, fadeMs);
});

window.setTimeout(function () {
if (token === transitionToken[layer]) {
cleanupLayerDecks(layer, newDeck);
}
}, fadeMs + 120);
});
}

function calculateMix(x, y) {
return {
topAmount: 1 - y,
bottomAmount: y,
openAmount: x,
lowAmount: 1 - x,
topPitch: getLayerPitch("top", y),
bottomPitch: getLayerPitch("bottom", y)
};
}

function updateLayerPhase(mix, deltaMs) {
if (!audioStarted) return;

var deltaSeconds = deltaMs / 1000;
layerPhase.top += deltaSeconds * clamp(mix.topPitch, 0.25, 4);
layerPhase.bottom += deltaSeconds * clamp(mix.bottomPitch, 0.25, 4);

if (layerDuration.top > 0) layerPhase.top = layerPhase.top % layerDuration.top;
if (layerDuration.bottom > 0) layerPhase.bottom = layerPhase.bottom % layerDuration.bottom;
}

function updateAudioMix(mix, deltaMs) {
if (!audioStarted || !masterGain || !audioContext) return;

var wantedVolume = isMuted ? 0 : (parseFloat(volumeSlider.value) || 0);
var dezipperMs = dataNumber("audio-dezipper-ms", 20);
var pitchDezipperMs = dataNumber("pitch-dezipper-ms", Math.max(15, dezipperMs));

var step = deltaMs / 1000;

if (currentMasterVolume < wantedVolume) {
currentMasterVolume = Math.min(wantedVolume, currentMasterVolume + step);
} else if (currentMasterVolume > wantedVolume) {
currentMasterVolume = Math.max(wantedVolume, currentMasterVolume - step);
}

setAudioParam(masterGain.gain, currentMasterVolume, dezipperMs);

function updateDeck(deck, layerAmount, pitch, layerTargetVolume) {
if (!deck || !deck.active) return;

var layerVolume = layerAmount * clamp(layerTargetVolume, 0, 1) * deck.item.targetVolume;

setAudioParam(deck.layerGain.gain, layerVolume, dezipperMs);
setAudioParam(deck.openGain.gain, mix.openAmount, dezipperMs);
setAudioParam(deck.lowGain.gain, mix.lowAmount, dezipperMs);

var phase = layerPhase[deck.layer] || 0;
updateLoopingSource(deck.openSource, phase, pitch, pitchDezipperMs);
updateLoopingSource(deck.lowSource, phase, pitch, pitchDezipperMs);
updateClickLowpass(deck, phase, dezipperMs);
updateDeckPanning(deck, visualPosition.x, visualPosition.y, dataNumber("panning-dezipper-ms", 70));
}

decksByLayer.top.forEach(function (deck) {
updateDeck(deck, mix.topAmount, mix.topPitch, dataNumber("top-target-volume", 1));
});

decksByLayer.bottom.forEach(function (deck) {
updateDeck(deck, mix.bottomAmount, mix.bottomPitch, dataNumber("bottom-target-volume", 1));
});
}

function updateCrosshairAndOverlays(displayX, displayY) {
  var topAmount = 1 - displayY;
  var bottomAmount = displayY;
  var leftAmount = 1 - displayX;
  var now = performance.now();

  var topFadeIn = getLayerFadeInModifier("top", now);
  var bottomFadeIn = getLayerFadeInModifier("bottom", now);

  if (crosshair) {
    crosshair.style.left = (displayX * 100) + "%";
    crosshair.style.top = (displayY * 100) + "%";
  }

  if (overlayTop) overlayTop.style.opacity = String(clamp(topAmount * dataNumber("top-overlay-max-opacity", 0.32), 0, 1) * topFadeIn);
  if (overlayBottom) overlayBottom.style.opacity = String(clamp(bottomAmount * dataNumber("bottom-overlay-max-opacity", 0.32), 0, 1) * bottomFadeIn);
  if (overlayLeft) overlayLeft.style.opacity = String(clamp(leftAmount * dataNumber("left-overlay-max-opacity", dataNumber("right-overlay-max-opacity", 0.28)), 0, 1));

  updateOverlayClones(now);
}

function updateOverlayClones(now) {
  if (!overlayClones.length) return;

  now = now || performance.now();
  
  overlayClones = overlayClones.filter(function (clone) {
    if (!clone || !clone.parentNode) return false;

    var layer = clone.getAttribute("data-layer") || "top";
    var start = parseFloat(clone.getAttribute("data-fade-start")) || now;
    var fadeMs = Math.max(1, parseFloat(clone.getAttribute("data-fade-ms")) || dataNumber("overlay-crossfade-ms", 3000));
    var progress = clamp((now - start) / fadeMs, 0, 1);
    
    var curvedProgress = Math.cos(progress * Math.PI * 0.5); 
    var amount = getLayerOverlayAmount(layer) * curvedProgress;

    clone.style.opacity = String(amount);

    if (progress >= 1) {
      try { clone.parentNode.removeChild(clone); } catch (error) {}
      return false;
    }

    return true;
  });
}
function updateSliderFill(slider) {
if (!slider) return;

var value = parseFloat(slider.value) || 0;
var min = parseFloat(slider.min) || 0;
var max = parseFloat(slider.max) || 1;
var percent = ((value - min) / Math.max(0.0001, max - min)) * 100;

slider.style.setProperty("--dvcfp-fill-percent", clamp(percent, 0, 100) + "%");
}

function updateMuteButton() {
if (!muteButton) return;

muteButton.setAttribute("aria-pressed", isMuted ? "false" : "true");
muteButton.classList.toggle("is-muted", isMuted);
muteButton.setAttribute("aria-label", isMuted ? "Unmute audio" : "Mute audio");
muteButton.setAttribute("title", isMuted ? "Unmute" : "Mute");
if (muteText) muteText.textContent = isMuted ? "Unmute" : "Mute";
}

function updateRandomizeButton() {
if (!randomizeButton) return;
randomizeButton.setAttribute("aria-pressed", randomActive ? "true" : "false");
}

function chooseRandomTarget() {
randomTarget.x = Math.random();
randomTarget.y = Math.random();
}

function updateRandomMovement(deltaMs) {
if (!randomActive) return;

var mode = getRandomizeMode();
var speed01 = speedSlider ? clamp(parseFloat(speedSlider.value) || 0, 0, 1) : clamp(dataNumber("randomize-default-speed", 0.35), 0, 1);
var speed = lerp(dataNumber("randomize-min-speed", 0.08), dataNumber("randomize-max-speed", 0.85), speed01);

if (mode === "drift") {
randomPhase += speed * (deltaMs / 1000) * 1.85;
position.x = clamp(0.5 + Math.sin(randomPhase * 0.73) * 0.32 + Math.sin(randomPhase * 1.47 + 1.6) * 0.12, 0, 1);
position.y = clamp(0.5 + Math.cos(randomPhase * 0.61 + 0.8) * 0.32 + Math.sin(randomPhase * 1.21 + 2.4) * 0.12, 0, 1);
return;
}

if (mode === "pulse") {
randomPhase += speed * (deltaMs / 1000) * 2.1;

if (randomPhase >= Math.PI * 2) {
randomPhase = randomPhase % (Math.PI * 2);
chooseRandomTarget();
}

var amount = Math.max(0, Math.sin(randomPhase));
amount = amount * amount * (3 - (2 * amount));
position.x = clamp(0.5 + ((randomTarget.x - 0.5) * amount), 0, 1);
position.y = clamp(0.5 + ((randomTarget.y - 0.5) * amount), 0, 1);
return;
}

var dx = randomTarget.x - position.x;
var dy = randomTarget.y - position.y;
var distance = Math.sqrt((dx * dx) + (dy * dy));
var reach = Math.max(0.001, dataNumber("randomize-reach-distance", 0.035));

if (distance <= reach) {
chooseRandomTarget();
return;
}

var step = speed * (deltaMs / 1000);
var amountToMove = Math.min(step, distance) / Math.max(0.0001, distance);

position.x = clamp(position.x + (dx * amountToMove), 0, 1);
position.y = clamp(position.y + (dy * amountToMove), 0, 1);
}

function setPositionFromEvent(event) {
if (!pad) return;

var rect = pad.getBoundingClientRect();
var clientX = event.clientX;
var clientY = event.clientY;

if (event.touches && event.touches.length) {
clientX = event.touches[0].clientX;
clientY = event.touches[0].clientY;
}

position.x = clamp((clientX - rect.left) / Math.max(1, rect.width), 0, 1);
position.y = clamp((clientY - rect.top) / Math.max(1, rect.height), 0, 1);
}

function updateAudioFrame(now) {
if (!lastTime) lastTime = now;

var deltaMs = Math.max(0, now - lastTime);
lastTime = now;

updateRandomMovement(deltaMs);

var responseSmoothingMs = isCrosshairSmoothingEnabled ? getResponseSmoothingMs() : 0;
visualPosition.x = smoothStep(visualPosition.x, position.x, deltaMs, responseSmoothingMs);
visualPosition.y = smoothStep(visualPosition.y, position.y, deltaMs, responseSmoothingMs);

var mix = calculateMix(visualPosition.x, visualPosition.y);

updateLayerPhase(mix, deltaMs);
updateCrosshairAndOverlays(visualPosition.x, visualPosition.y);
updateAudioMix(mix, deltaMs);

rafId = requestAnimationFrame(updateAudioFrame);
}

function startLoop() {
if (rafId) return;
lastTime = 0;
rafId = requestAnimationFrame(updateAudioFrame);
}

function onPadPointerDown(event) {
event.preventDefault();
startAudio();

if (isMuted) {
isMuted = false;
updateMuteButton();
updateExternalAudioState();
}

isDragging = true;
randomActive = false;
updateRandomizeButton();
setPositionFromEvent(event);

if (pad && pad.setPointerCapture && event.pointerId !== undefined) {
try { pad.setPointerCapture(event.pointerId); } catch (error) {}
}
}

function onPadPointerMove(event) {
if (!isDragging) return;

event.preventDefault();
setPositionFromEvent(event);
}

function onPadPointerUp(event) {
isDragging = false;

if (pad && pad.releasePointerCapture && event.pointerId !== undefined) {
try { pad.releasePointerCapture(event.pointerId); } catch (error) {}
}
}

function onPadKeyDown(event) {
var step = event.shiftKey ? 0.1 : 0.04;
var changed = false;

if (event.key === "ArrowLeft") { position.x = clamp(position.x - step, 0, 1); changed = true; }
if (event.key === "ArrowRight") { position.x = clamp(position.x + step, 0, 1); changed = true; }
if (event.key === "ArrowUp") { position.y = clamp(position.y - step, 0, 1); changed = true; }
if (event.key === "ArrowDown") { position.y = clamp(position.y + step, 0, 1); changed = true; }
if (event.key === "Enter" || event.key === " ") { startAudio(); changed = true; }

if (!changed) return;

if (isMuted) {
isMuted = false;
updateMuteButton();
updateExternalAudioState();
}

randomActive = false;
updateRandomizeButton();
event.preventDefault();
}

function bindEvents() {
if (window.IntersectionObserver) {
var visObserver = new IntersectionObserver(function(entries) {
entries.forEach(function(entry) {
if (!entry.isIntersecting && isStarted && !isMuted) {
isMuted = true;
updateMuteButton();
updateExternalAudioState();
}
});
}, { threshold: 0.01 });
visObserver.observe(root);
}

if (panel) {
panel.addEventListener("pointerdown", function (event) {
if (pad && pad.contains(event.target)) return;
if (event.target && event.target.closest && event.target.closest("button, input")) return;
startAudio();
});
}

if (pad) {
pad.addEventListener("pointerdown", onPadPointerDown);
window.addEventListener("pointermove", onPadPointerMove);
window.addEventListener("pointerup", onPadPointerUp);
pad.addEventListener("keydown", onPadKeyDown);
}

if (muteButton) {
muteButton.addEventListener("click", function () {
startAudio();
isMuted = !isMuted;
updateMuteButton();
updateExternalAudioState();
});
}

if (volumeSlider) {
volumeSlider.addEventListener("input", function () {
updateSliderFill(volumeSlider);

if (parseFloat(volumeSlider.value) > 0) {
isMuted = false;
updateMuteButton();
updateExternalAudioState();
startAudio();
}
});
}

if (randomizeButton) {
randomizeButton.addEventListener("click", function () {
startAudio();
randomActive = !randomActive;
if (randomActive) {
chooseRandomTarget();
if (getRandomizeMode() === "pulse") randomPhase = 0;
}
updateRandomizeButton();
});
}

if (panningButton) {
panningButton.addEventListener("click", function () {
startAudio();
setPanningEnabled(!isPanningEnabled);
});
}

if (smoothingButton) {
smoothingButton.addEventListener("click", function () {
startAudio();
setCrosshairSmoothingEnabled(!isCrosshairSmoothingEnabled);
});
}

if (randomModeTrigger) {
randomModeTrigger.addEventListener("click", function (event) {
event.preventDefault();
event.stopPropagation();
startAudio();
toggleRandomModeMenu();
});
}

randomModeButtons.forEach(function (button) {
button.addEventListener("click", function (event) {
event.preventDefault();
event.stopPropagation();
startAudio();
setRandomMode(button.getAttribute("data-mode"), true);
closeRandomModeMenu();
});
});

root.addEventListener("pointerdown", function (event) {
if (!randomModeMenu || !randomModeMenu.classList.contains("is-open")) return;
if (event.target && event.target.closest && event.target.closest(".dvcfp-random-mode-trigger, .dvcfp-random-mode-menu")) return;
closeRandomModeMenu();
}, true);

if (speedSlider) {
speedSlider.addEventListener("input", function () {
updateSliderFill(speedSlider);
});
}

if (responseSlider) {
responseSlider.addEventListener("input", function () {
updateSliderFill(responseSlider);
});
}

if (panningStrengthSlider) {
panningStrengthSlider.addEventListener("input", function () {
updateSliderFill(panningStrengthSlider);
decksByLayer.top.concat(decksByLayer.bottom).forEach(function (deck) {
updateDeckPanning(deck, visualPosition.x, visualPosition.y, dataNumber("panning-dezipper-ms", 70));
});
});
}

itemButtons.forEach(function (button) {
button.addEventListener("click", function (event) {
event.preventDefault();

var layer = button.getAttribute("data-layer");
var itemIndex = parseInt(button.getAttribute("data-item"), 10);

if (!Number.isFinite(itemIndex) || button.disabled) return;

replaceLayer(layer, itemIndex);
startAudio();

if (isMuted) {
isMuted = false;
updateMuteButton();
updateExternalAudioState();
}
});
});
}

function init() {
setupTextures();
setupItemButtons();
updateSliderFill(volumeSlider);
updateSliderFill(speedSlider);
updateSliderFill(responseSlider);
updateSliderFill(panningStrengthSlider);
updateMuteButton();
updateRandomizeButton();
updatePanningButton();
updateSmoothingButton();
updateCrosshairAndOverlays(visualPosition.x, visualPosition.y);
bindEvents();
startLoop();
preloadCurrentItems();
}

init();
});
})();
</script>

<script>
(function () {
function syncFaderHeights(root) {
var slots = root.querySelectorAll(".dvcfp-fader-slot");
slots.forEach(function (slot) {
var rect = slot.getBoundingClientRect();
if (!rect || rect.height <= 0) return;
slot.style.setProperty("--dvcfp-live-fader-height", rect.height + "px");
});
}

function syncAllFaderHeights() {
document.querySelectorAll(".dysphoria-pad").forEach(syncFaderHeights);
}

function scheduleSync() {
window.requestAnimationFrame(function () {
syncAllFaderHeights();
window.requestAnimationFrame(syncAllFaderHeights);
});
}

if (document.readyState === "loading") {
document.addEventListener("DOMContentLoaded", scheduleSync);
} else {
scheduleSync();
}

window.addEventListener("resize", scheduleSync);

if (window.ResizeObserver) {
var observer = new ResizeObserver(scheduleSync);
window.requestAnimationFrame(function () {
document.querySelectorAll(".dvcfp-panel-mixer, .dvcfp-mixer-controls, .dvcfp-mixer-bank, .dvcfp-mixer-strip, .dvcfp-fader-slot").forEach(function (element) {
try { observer.observe(element); } catch (error) {}
});
});
}
})();
</script>

<script>
(function () {
function applyMixerParameters(root) {
if (!root) return;

var panel = root.querySelector(".dvcfp-panel-mixer") || root;
var pairs = [
["slider-x-position", "--dvcfp-slider-x-position"],
["slider-label-x-position", "--dvcfp-slider-label-x-position"],
["slider-label-y-position", "--dvcfp-slider-label-y-position"],
["random-mode-x-position", "--dvcfp-random-mode-x-position"],
["random-mode-y-position", "--dvcfp-random-mode-y-position"],
["random-mode-scale-x", "--dvcfp-random-mode-scale-x"],
["random-mode-scale-y", "--dvcfp-random-mode-scale-y"],
["random-mode-width", "--dvcfp-random-mode-width"],
["random-mode-height", "--dvcfp-random-mode-height"]
];

pairs.forEach(function (pair) {
var rootValue = root.getAttribute("data-" + pair[0]);
var panelValue = panel.getAttribute("data-" + pair[0]);
var value = panelValue !== null && panelValue !== "" ? panelValue : rootValue;

if (value === null || value === "") return;

root.style.setProperty(pair[1], value);
panel.style.setProperty(pair[1], value);
});
}

function applyAllMixerParameters() {
document.querySelectorAll(".dysphoria-pad").forEach(applyMixerParameters);
}

if (document.readyState === "loading") {
document.addEventListener("DOMContentLoaded", applyAllMixerParameters);
} else {
applyAllMixerParameters();
}
})();
</script>
