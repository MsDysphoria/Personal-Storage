document.mozCancelFullScreen();

}

if (root.requestFullscreen) {

} else if (root.webkitRequestFullscreen) {
root.webkitRequestFullscreen();
} else if (root.mozRequestFullScreen) {

var controlPanelOpacity = clamp(dataNumber("controlPanelOpacity", 0.86), 0, 1);

var controlPanelBorderColor = dataText("controlPanelBorderColor", "rgba(218, 178, 136, 0.20)");

var controlButtonActiveBorderColor = dataText("controlButtonActiveBorderColor", "rgba(255, 218, 178, 0.34)");

var controlSymbolIconSize = dataCssLength("controlSymbolIconSize", "0.92rem");

var volumeYPosition = dataCssLength("volumeYPosition", "0rem");
var volumeOpacity = clamp(dataNumber("volumeOpacity", 0.72), 0, 1);
var volumeShadow = dataText("volumeShadow", "drop-shadow(0 0 0 rgb(0 0 0 / 0))");

var miniControlsOpacity = clamp(dataNumber("miniControlsOpacity", 0.9), 0, 1);

var buttonOpacity = clamp(dataNumber("buttonOpacity", 0.68), 0, 1);

var buttonShadow = dataText("buttonShadow", "drop-shadow(0 0 0 rgb(0 0 0 / 0))");

var audioGlowColor = dataText("audioGlowColor", "255 170 82");
var audioGlowHeight = dataCssLength("audioGlowHeight", "2.4rem");
var authorNote = dataText("authorNote", "").trim();

loopEnabled = dataBool("loop", true);
spatialEnabled = dataBool("spatialAudio", false);
audioGlowEnabled = dataBool("audioGlow", true);
hasAuthorNote = authorNote.length > 0;
previousVolume = startVolume > 0 ? startVolume : 0.8;

video.crossOrigin = "anonymous";
video.preload = "none";

video.playsInline = true;
video.removeAttribute("src");
video.draggable = false;

if (thumbnail) {

root.style.setProperty("--dsv-aspect-ratio", aspectRatio);
root.style.setProperty("--dsv-object-fit", objectFit);

root.style.setProperty("--dsv-bottom-vignette-opacity", bottomVignetteOpacity);

root.style.setProperty("--dsv-author-note-opacity", authorNoteOpacity);
root.style.setProperty("--dsv-author-note-background", authorNoteBackground);
root.style.setProperty("--dsv-author-note-border-color", authorNoteBorderColor);
root.style.setProperty("--dsv-author-note-shadow", authorNoteShadow);
root.style.setProperty("--dsv-author-note-y-position", authorNoteYPosition);

root.style.setProperty("--dsv-time-opacity", timeOpacity);
root.style.setProperty("--dsv-time-shadow", timeShadow);

root.style.setProperty("--dsv-hover-time-opacity", hoverTimeOpacity);

root.style.setProperty("--dsv-waveform-width-scale", waveformWidthScale);
root.style.setProperty("--dsv-waveform-height", waveformHeight);

root.style.setProperty("--dsv-control-panel-opacity", controlPanelOpacity);
root.style.setProperty("--dsv-control-panel-background", controlPanelBackground);

if (authorNotePanel) {

}

volume.value = String(startVolume);
video.volume = startVolume;
video.muted = startVolume <= 0;

if (thumbnailSrc) {
thumbnail.style.backgroundImage = 'url("' + thumbnailSrc.replace(/"/g, "%22") + '")';
}

setVolumeFill();
generateSilentWaveform();
drawWaveform();
updateTimeDisplay();
updateButton();
updateLoopState();
updateSpatialState();
updateAudioGlowState();
updateMuteState();
updateInfoState();
updateFullscreenState();
setAudioGlow(0);
}

function ensureVideoLoaded() {
if (videoLoaded) return true;

var videoSrc = dataText("videoSrc", "");
if (!videoSrc) return false;

video.preload = "metadata";
video.src = videoSrc;
video.load();

videoLoaded = true;
root.classList.add("dsv-video-loaded");

return true;
}

function prepareMedia() {
ensureVideoLoaded();
makeWaveformVisible();
generateAudioWaveform();
}

function applyPendingSeek() {
if (pendingSeekRatio === null) return;
if (!videoLoaded) return;
if (!Number.isFinite(video.duration) || video.duration <= 0) return;

try {
video.currentTime = video.duration * clamp(pendingSeekRatio, 0, 1);
pendingSeekRatio = null;
drawWaveform();
updateTimeDisplay();
} catch (error) {}
}

function updateButton() {
var playing = !video.paused && !video.ended;

root.classList.toggle("dsv-playing", playing);
toggle.setAttribute("aria-pressed", playing ? "true" : "false");
toggle.setAttribute("aria-label", playing ? "Stop video" : "Start video");
}

function updateLoop() {
updateAudioFeatures();
drawWaveform();
updateTimeDisplay();

if (!video.paused && !video.ended) {
frame = requestAnimationFrame(updateLoop);
} else {
frame = null;
}
}

function startLoop() {
if (frame) cancelAnimationFrame(frame);
frame = requestAnimationFrame(updateLoop);
startAudioFeatureTimer();
}

function stopLoop() {
if (frame) {
cancelAnimationFrame(frame);
frame = null;
}

if (video.paused || video.ended) {
stopAudioFeatureTimer();
}

updateAudioFeatures();
drawWaveform();
updateTimeDisplay();
}

function startVideo() {
if (!ensureVideoLoaded()) return;

root.classList.add("dsv-video-touched");

video.loop = loopEnabled;

makeWaveformVisible();
generateAudioWaveform();
setupAudioGraph();
resumeAudioContext();
updateSpatialAutomation();

if (Number.isFinite(video.duration) && video.duration > 0) {
applyPendingSeek();
}

var promise = video.play();

if (promise && promise.catch) {
promise.catch(function () {});
}

updateButton();
updateLoopState();
updateSpatialState();
updateAudioGlowState();
updateMuteState();
startLoop();
}

function stopVideo() {
try {
video.pause();
} catch (error) {}

updateButton();
stopLoop();
}

function togglePlayback() {
if (video.paused || video.ended) {
startVideo();
} else {
stopVideo();
}
}

function seekToRatio(ratio) {
ratio = clamp(ratio, 0, 1);

if (videoLoaded && Number.isFinite(video.duration) && video.duration > 0) {
try {
video.currentTime = video.duration * ratio;
} catch (error) {}
} else {
pendingSeekRatio = ratio;
}

makeWaveformVisible();
drawWaveform();
updateTimeDisplay();
}

function seekBySeconds(seconds) {
if (videoLoaded && Number.isFinite(video.duration) && video.duration > 0) {
seekToRatio(((video.currentTime || 0) + seconds) / video.duration);
return;
}

seekToRatio(getProgressRatio() + (seconds >= 0 ? 0.04 : -0.04));
}

function getPointerRatio(event) {
var rect = waveformWrap.getBoundingClientRect();
var x = event.clientX - rect.left;

return clamp(x / Math.max(1, rect.width), 0, 1);
}

function focusWaveform() {
try {
waveformWrap.focus({ preventScroll: true });
} catch (error) {
try {
waveformWrap.focus();
} catch (innerError) {}
}
}

function handleSpaceToggle(event) {
var key = event.key || event.code;

if (key !== " " && key !== "Space" && key !== "Spacebar") return;

event.preventDefault();
event.stopPropagation();

togglePlayback();
}

function handleWaveformKeydown(event) {
var key = event.key || event.code;

if (key === " " || key === "Space" || key === "Spacebar") {
handleSpaceToggle(event);
return;
}

if (key === "ArrowLeft") {
event.preventDefault();
seekBySeconds(-Math.max(1, dataNumber("waveformKeyboardSeekSeconds", 5)));
return;
}

if (key === "ArrowRight") {
event.preventDefault();
seekBySeconds(Math.max(1, dataNumber("waveformKeyboardSeekSeconds", 5)));
return;
}

if (key === "Home") {
event.preventDefault();
seekToRatio(0);
return;
}

if (key === "End") {
event.preventDefault();
seekToRatio(1);
}
}

function closestTarget(event, selector) {
if (!event.target || !event.target.closest) return null;
return event.target.closest(selector);
}

root.addEventListener("selectstart", function (event) {
event.preventDefault();
});

root.addEventListener("dragstart", function (event) {
event.preventDefault();
});

frameElement.addEventListener("mousedown", function (event) {
if (
closestTarget(event, ".dsv-waveform-wrap") ||
closestTarget(event, ".dsv-volume") ||
closestTarget(event, ".dsv-mini-button") ||
closestTarget(event, ".dsv-author-note-panel")
) {
return;
}

event.preventDefault();
});

frameElement.addEventListener("dblclick", function (event) {
event.preventDefault();
event.stopPropagation();
});

frameElement.addEventListener("pointerenter", function () {
root.classList.add("dsv-pointer-inside");
prepareMedia();
});

frameElement.addEventListener("pointerleave", function () {
root.classList.remove("dsv-pointer-inside");

if (waveformWrap) {
waveformWrap.classList.remove("dsv-hovering");
}
});

frameElement.addEventListener("click", function (event) {
if (
closestTarget(event, ".dsv-waveform-wrap") ||
closestTarget(event, ".dsv-volume") ||
closestTarget(event, ".dsv-toggle") ||
closestTarget(event, ".dsv-mini-button") ||
closestTarget(event, ".dsv-author-note-panel")
) {
return;
}

togglePlayback();
});

toggle.addEventListener("mousedown", function (event) {
event.preventDefault();
});

toggle.addEventListener("click", function (event) {
event.preventDefault();
event.stopPropagation();
togglePlayback();
});

toggle.addEventListener("keydown", handleSpaceToggle);

if (loopButton) {
loopButton.addEventListener("mousedown", function (event) {
event.preventDefault();
});

loopButton.addEventListener("click", function (event) {
event.preventDefault();
event.stopPropagation();

loopEnabled = !loopEnabled;
root.dataset.loop = loopEnabled ? "true" : "false";
updateLoopState();
});
}

if (spatialButton) {
spatialButton.addEventListener("mousedown", function (event) {
event.preventDefault();
});

spatialButton.addEventListener("click", function (event) {
event.preventDefault();
event.stopPropagation();

spatialEnabled = !spatialEnabled;
root.dataset.spatialAudio = spatialEnabled ? "true" : "false";

ensureVideoLoaded();
generateAudioWaveform();
setupAudioGraph();
resumeAudioContext();
updateSpatialState();
updateSpatialAutomation();
updateAudioFeatures();
});
}

if (muteButton) {
muteButton.addEventListener("mousedown", function (event) {
event.preventDefault();
});

muteButton.addEventListener("click", function (event) {
event.preventDefault();
event.stopPropagation();

var value = clamp(parseFloat(volume.value) || 0, 0, 1);

if (!video.muted && value > 0) {
previousVolume = value;
video.muted = true;
} else {
if (value <= 0) {
volume.value = String(previousVolume || 0.8);
video.volume = clamp(parseFloat(volume.value) || 0.8, 0, 1);
setVolumeFill();
}

video.muted = false;
}

updateMuteState();
});
}

if (infoButton) {
infoButton.addEventListener("mousedown", function (event) {
event.preventDefault();
});

infoButton.addEventListener("click", function (event) {
event.preventDefault();
event.stopPropagation();

if (!hasAuthorNote) return;

root.classList.toggle("dsv-note-visible");
updateInfoState();
});
}

if (fullscreenButton) {
fullscreenButton.addEventListener("mousedown", function (event) {
event.preventDefault();
});

fullscreenButton.addEventListener("click", function (event) {
event.preventDefault();
event.stopPropagation();

toggleFullscreen();
});
}

volume.addEventListener("input", function () {
var value = clamp(parseFloat(volume.value) || 0, 0, 1);

video.volume = value;
video.muted = value <= 0;

if (value > 0) {
previousVolume = value;
}

setVolumeFill();
updateMuteState();
});

volume.addEventListener("keydown", handleSpaceToggle);

waveformWrap.addEventListener("keydown", handleWaveformKeydown);

waveformWrap.addEventListener("focus", function () {
makeWaveformVisible();
drawWaveform();
});

waveformWrap.addEventListener("pointerenter", function (event) {
waveformWrap.classList.add("dsv-hovering");
waveformHoverRatio = getPointerRatio(event);
updateHoverTime(waveformHoverRatio, event.clientX);
});

waveformWrap.addEventListener("pointermove", function (event) {
waveformHoverRatio = getPointerRatio(event);
updateHoverTime(waveformHoverRatio, event.clientX);

if (!isPointerDown) return;
seekToRatio(waveformHoverRatio);
});

waveformWrap.addEventListener("pointerleave", function () {
if (!isPointerDown) {
waveformWrap.classList.remove("dsv-hovering");
}
});

waveformWrap.addEventListener("pointerdown", function (event) {
isPointerDown = true;

focusWaveform();
waveformWrap.classList.add("dsv-hovering");

try {
waveformWrap.setPointerCapture(event.pointerId);
} catch (error) {}

waveformHoverRatio = getPointerRatio(event);
updateHoverTime(waveformHoverRatio, event.clientX);
seekToRatio(waveformHoverRatio);
});

waveformWrap.addEventListener("pointerup", function (event) {
isPointerDown = false;

try {
waveformWrap.releasePointerCapture(event.pointerId);
} catch (error) {}
});

waveformWrap.addEventListener("pointercancel", function (event) {
isPointerDown = false;
waveformWrap.classList.remove("dsv-hovering");

try {
waveformWrap.releasePointerCapture(event.pointerId);
} catch (error) {}
});

video.addEventListener("loadedmetadata", function () {
applyPendingSeek();
drawWaveform();
updateTimeDisplay();
});

video.addEventListener("timeupdate", function () {
drawWaveform();
updateTimeDisplay();
});

video.addEventListener("play", function () {
root.classList.add("dsv-video-touched");
makeWaveformVisible();
generateAudioWaveform();
setupAudioGraph();
resumeAudioContext();
updateButton();
updateLoopState();
updateSpatialState();
updateAudioGlowState();
updateMuteState();
updateSpatialAutomation();
startLoop();
});

video.addEventListener("pause", function () {
updateButton();
stopLoop();
});

video.addEventListener("ended", function () {
updateButton();
stopLoop();
});

window.addEventListener("resize", function () {
drawWaveform();

if (hoverTime) {
updateHoverTime(waveformHoverRatio);
}

updateFullscreenState();
});

document.addEventListener("fullscreenchange", updateFullscreenState);
document.addEventListener("webkitfullscreenchange", updateFullscreenState);
document.addEventListener("mozfullscreenchange", updateFullscreenState);
document.addEventListener("MSFullscreenChange", updateFullscreenState);

document.addEventListener("visibilitychange", function () {
if (!document.hidden && !video.paused && !video.ended) {
startLoop();
} else if (!document.hidden) {
drawWaveform();
updateTimeDisplay();
}
});

setupBaseState();
});
})();
