if (ambienceSelect) {
ambienceSelect.value = currentAmbience;

ambienceSelect.addEventListener("change", function () {
currentAmbience = ambienceSelect.value || "clean";
applyAmbiencePreset();
});
}

randomizerButtons.forEach(function (button) {
button.addEventListener("click", function () {
toggleRandomizer(button.dataset.randomizer || "");
});
});

volumeSlider.addEventListener("input", function () {
var volume = parseFloat(volumeSlider.value) || 0;

isAudioArmed = volume > 0;
updateUI();
resumeVisuals();
});

wetnessSlider.addEventListener("input", function (event) {
maybeStopRandomizerFromManualInput("wetness", event);
updateUI();
});

speedSlider.addEventListener("input", function (event) {
maybeStopRandomizerFromManualInput("speed", event);
updateUI();
updateAnimationSpeed();
});

creakBox.addEventListener("change", function () {
updateUI();
});

if (animationVideo) {
animationVideo.addEventListener("loadedmetadata", function () {
resetFrameState();
updateAnimationSpeed();
drawAnimationCanvasFrame();

try {
if (canRunVisuals()) {
var promise = animationVideo.play();

if (promise && promise.catch) {
promise.catch(function () {});
}
}
} catch (error) {}
});

animationVideo.addEventListener("play", function () {
resetFrameState();
});

animationVideo.addEventListener("seeked", function () {
resetFrameState();
drawAnimationCanvasFrame();
});
}

volumeSlider.value = root.dataset.defaultVolume || "0";
wetnessSlider.value = root.dataset.defaultWetness || "0";
speedSlider.value = root.dataset.defaultSpeed || "1";
speedSlider.min = root.dataset.speedMin || "0.5";
speedSlider.max = root.dataset.speedMax || "2";

applyRandomizerIcons();
updateRandomizerButton("wetness");
updateRandomizerButton("speed");

preparePools();
setupAnimationVideo();
setupVisibilityHandlers();

if (ambienceSelect) {
ambienceSelect.value = currentAmbience;
}

applyAmbiencePreset();
updateUI();

isAudioArmed = (parseFloat(volumeSlider.value) || 0) > 0;
resumeVisuals();
});
})();
</script>
