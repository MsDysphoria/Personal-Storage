var wetnessValue = root.querySelector('[data-value="wetness"]');
var speedValue = root.querySelector('[data-value="speed"]');

var currentSurface = root.dataset.defaultSurface || "wood";
var pools = {};
var lastPlayed = {};

var frameMonitor = null;
var lastFrame = null;
var firedThisLoop = {};
var isAudioArmed = false;

var floorOffsetX = 0;
var wetOffsetX = 0;
var lastVisualTime = 0;
var lastAnimationCanvasRenderTime = 0;

function dataNumber(name, fallback) {
var value = parseFloat(root.dataset[name]);
return Number.isFinite(value) ? value : fallback;
}

function dataText(name, fallback) {
var value = root.dataset[name];
return value === undefined || value === "" ? fallback : value;
}

function clamp(value, min, max) {
return Math.max(min, Math.min(max, value));
}

function lerp(a, b, t) {
return a + ((b - a) * t);
}

function getSpeed() {
return parseFloat(speedSlider.value) || 1;
}

function usableSource(src) {
if (!src) return false;
if (src.indexOf("PASTE_") === 0) return false;
return true;
}

function imageUrl(src) {
return 'url("' + src.replace(/"/g, "%22") + '")';
}

function getSurfaceImageSrc(surface) {
if (surface === "wood") return root.dataset.floorWoodImageSrc || "";
if (surface === "dirt") return root.dataset.floorDirtImageSrc || "";
if (surface === "concrete") return root.dataset.floorConcreteImageSrc || "";
return "";
}

function getTotalFrames() {
return Math.max(1, Math.round(dataNumber("animationTotalFrames", 60)));
}

function getFrameBase() {
return Math.round(dataNumber("animationFrameBase", 1));
}

function getTriggerFrames() {
var raw = root.dataset.animationTriggerFrames || "21,49";

return raw.split(",").map(function (item) {
return parseInt(item.trim(), 10);
}).filter(function (value) {
return Number.isFinite(value);
});
}

function getCurrentVideoFrame() {
if (!animationVideo) return getFrameBase();

var totalFrames = getTotalFrames();
var base = getFrameBase();
var duration = animationVideo.duration;
var time = animationVideo.currentTime || 0;

if (!Number.isFinite(duration) || duration <= 0) {
return base;
}

var normalized = clamp(time / duration, 0, 0.999999);
var zeroBasedFrame = Math.floor(normalized * totalFrames);

return base + zeroBasedFrame;
}

function crossedFrame(target, previous, current, looped) {
if (previous === null) return false;

if (looped) {
return target > previous || target <= current;
}

return target > previous && target <= current;
}

function getSpeedMappedValue(prefix, fallbackMin, fallbackMid, fallbackMax) {
var speed = getSpeed();

var speedMin = dataNumber("speedMin", 0.5);
var speedMid = dataNumber("speedMid", 1);
var speedMax = dataNumber("speedMax", 2);

var valueMin = dataNumber(prefix + "AtMinSpeed", fallbackMin);
var valueMid = dataNumber(prefix + "AtMidSpeed", fallbackMid);
var valueMax = dataNumber(prefix + "AtMaxSpeed", fallbackMax);

if (speed <= speedMid) {
return lerp(valueMin, valueMid, clamp((speed - speedMin) / (speedMid - speedMin), 0, 1));
}

return lerp(valueMid, valueMax, clamp((speed - speedMid) / (speedMax - speedMid), 0, 1));
}

function getFootstepPitch() {
return getSpeedMappedValue("footstepPitch", 0.9, 1, 1.2);
}

function getWetPitch() {
return getSpeedMappedValue("wetPitch", 0.85, 1, 1.15);
}

function getCreakPitch() {

}

function getFootstepSpeedVolume() {

}

function getWetSpeedVolume() {
return getSpeedMappedValue("wetVolume", 0.5, 0.75, 1);
}

function getCreakSpeedVolume() {
return getSpeedMappedValue("creakVolume", 0.5, 0.75, 1);
}

function getWetChance() {
var wetness = parseFloat(wetnessSlider.value) || 0;
var fullAt = dataNumber("wetFullChanceAt", 0.3);
return clamp(wetness / fullAt, 0, 1);
}

function getCreakChance() {
return getSpeedMappedValue("creakChance", 0, 0.15, 0.3);
}

function getAnimationSpeed() {
var multiplier = dataNumber("animationSpeedMultiplier", 1);
var min = dataNumber("animationMinSpeed", 0.1);
var max = dataNumber("animationMaxSpeed", 4);

return clamp(getSpeed() * multiplier, min, max);
}

function getAnimationRenderFps() {
return Math.max(0, dataNumber("animationRenderFps", 0));
}

function getAnimationRenderSmoothing() {
return dataText("animationRenderSmoothing", "false") !== "false";
}

function getFloorScrollSpeed() {
return getSpeedMappedValue("floorScroll", -16, -32, -64);
}

function getWetImageScrollSpeed() {
return getSpeedMappedValue("wetImageScroll", -12, -24, -48);
}

function updateBlackUnderlay() {
if (!blackUnderlay) return;

blackUnderlay.style.background = dataText("blackUnderlayColor", "rgb(0 0 0)");
blackUnderlay.style.opacity = String(clamp(dataNumber("blackUnderlayOpacity", 1), 0, 1));

function animationCanvasIsEnabled() {

getAnimationRenderFps() > 0 &&
animationCanvas &&
animationCanvasContext &&
animationVideo &&
animationVideo.src &&
animationVideo.style.display !== "none"

}

function updateAnimationPresenterState() {
if (!animationVideo || !animationCanvas) return;

if (animationCanvasIsEnabled()) {
animationVideo.style.opacity = "0";
animationCanvas.style.display = "block";
} else {
animationVideo.style.opacity = "1";
animationCanvas.style.display = "none";
}
}

function resizeAnimationCanvas() {
if (!animationCanvas) return false;

var rect = animationCanvas.getBoundingClientRect();
var ratio = window.devicePixelRatio || 1;
var width = Math.max(1, Math.round(rect.width * ratio));
var height = Math.max(1, Math.round(rect.height * ratio));

if (animationCanvas.width !== width || animationCanvas.height !== height) {
animationCanvas.width = width;
animationCanvas.height = height;
return true;
}

return false;
}

function drawAnimationCanvasFrame() {
if (!animationCanvasIsEnabled()) return;

var ctx = animationCanvasContext;
var videoWidth = animationVideo.videoWidth || 0;
var videoHeight = animationVideo.videoHeight || 0;

if (!videoWidth || !videoHeight) return;

resizeAnimationCanvas();

var canvasWidth = animationCanvas.width;
var canvasHeight = animationCanvas.height;

ctx.setTransform(1, 0, 0, 1, 0, 0);
ctx.clearRect(0, 0, canvasWidth, canvasHeight);

ctx.imageSmoothingEnabled = getAnimationRenderSmoothing();

var scale = Math.min(canvasWidth / videoWidth, canvasHeight / videoHeight);
var drawWidth = videoWidth * scale;
var drawHeight = videoHeight * scale;
var drawX = (canvasWidth - drawWidth) * 0.5;
var drawY = (canvasHeight - drawHeight) * 0.5;

try {
ctx.drawImage(animationVideo, drawX, drawY, drawWidth, drawHeight);
} catch (error) {}
}

function updateAnimationCanvas(now) {
updateAnimationPresenterState();

if (!animationCanvasIsEnabled()) return;

var fps = getAnimationRenderFps();
var interval = 1000 / fps;

if (!lastAnimationCanvasRenderTime || now - lastAnimationCanvasRenderTime >= interval) {
lastAnimationCanvasRenderTime = now;
drawAnimationCanvasFrame();
}
}

function updateAnimationTransform() {
var scale = dataNumber("animationScale", 1);
var scaleX = dataNumber("animationScaleX", 1) * scale;
var scaleY = dataNumber("animationScaleY", 1) * scale;
var positionY = dataText("animationPositionY", "0");
var transform = "translateY(" + positionY + ") scale(" + scaleX + ", " + scaleY + ")";
var origin = dataText("animationTransformOrigin", "center center");

if (animationVideo) {
animationVideo.style.transform = transform;
animationVideo.style.transformOrigin = origin;
}

if (animationCanvas) {
animationCanvas.style.transform = transform;
animationCanvas.style.transformOrigin = origin;
}
}

function setupAnimationVideo() {
if (!animationVideo) return;

var src = root.dataset.animationSrc || "";

if (!usableSource(src)) {
animationVideo.removeAttribute("src");
animationVideo.style.display = "none";
root.classList.remove("dfp-has-animation-video");
updateAnimationPresenterState();
return;
}

animationVideo.src = src;
animationVideo.muted = true;
animationVideo.loop = true;
animationVideo.playsInline = true;
animationVideo.setAttribute("muted", "");
animationVideo.setAttribute("playsinline", "");
animationVideo.preload = "auto";
animationVideo.style.display = "block";
root.classList.add("dfp-has-animation-video");

updateAnimationTransform();
updateAnimationSpeed();
updateAnimationPresenterState();

try {
animationVideo.load();

var promise = animationVideo.play();

if (promise && promise.catch) {
promise.catch(function () {});
}
} catch (error) {}
}

function updateAnimationSpeed() {
if (!animationVideo || !animationVideo.src) return;

try {
animationVideo.playbackRate = getAnimationSpeed();

var promise = animationVideo.play();

if (promise && promise.catch) {
promise.catch(function () {});
}
} catch (error) {}
}

function updateVideoPlaceholderState() {
var hasFloor = floorLayer && usableSource(getSurfaceImageSrc(currentSurface));
var hasWet = wetLayer && usableSource(root.dataset.wetImageSrc || "");
var hasAnim = root.classList.contains("dfp-has-animation-video");

root.classList.toggle("dfp-has-video", hasFloor || hasWet || hasAnim);
}

function updateFloorLayer() {
if (!floorLayer) return;

var src = getSurfaceImageSrc(currentSurface);

if (!usableSource(src)) {
floorLayer.style.backgroundImage = "none";
floorLayer.style.opacity = "0";
return;
}

var offsetY = dataText("floorImageOffsetY", "0");
var scaleY = dataNumber("floorImageScaleY", 1);

floorLayer.style.backgroundImage = imageUrl(src);
floorLayer.style.backgroundRepeat = dataText("floorImageRepeat", "repeat-x");
floorLayer.style.backgroundSize = dataText("floorImageSize", "auto 100%");
floorLayer.style.mixBlendMode = dataText("floorImageBlendMode", "normal");
floorLayer.style.opacity = String(clamp(dataNumber("floorImageOpacity", 1), 0, 1));
floorLayer.style.transform = "translateY(" + offsetY + ") scaleY(" + scaleY + ")";
floorLayer.style.transformOrigin = dataText("floorImageTransformOrigin", "center bottom");
}

function updateWetLayer() {
if (!wetLayer) return;

var src = root.dataset.wetImageSrc || "";

if (!usableSource(src)) {
wetLayer.style.backgroundImage = "none";
wetLayer.style.opacity = "0";
return;
}

var wetness = parseFloat(wetnessSlider.value) || 0;
var maxOpacity = clamp(dataNumber("wetImageMaxOpacity", 1), 0, 1);
var offsetY = dataText("wetImageOffsetY", "0");
var scaleY = dataNumber("wetImageScaleY", 1);

wetLayer.style.backgroundImage = imageUrl(src);
wetLayer.style.backgroundRepeat = dataText("wetImageRepeat", "repeat-x");
wetLayer.style.backgroundSize = dataText("wetImageSize", "auto 100%");
wetLayer.style.mixBlendMode = dataText("wetImageBlendMode", "soft-light");
wetLayer.style.opacity = String(clamp(wetness, 0, 1) * maxOpacity);
wetLayer.style.transform = "translateY(" + offsetY + ") scaleY(" + scaleY + ")";
wetLayer.style.transformOrigin = dataText("wetImageTransformOrigin", "center bottom");
}

function updateMovingImagePositions(deltaSeconds) {
var floorY = dataText("floorImagePositionY", "center");
var wetY = dataText("wetImagePositionY", "center");

floorOffsetX += getFloorScrollSpeed() * deltaSeconds;
wetOffsetX += getWetImageScrollSpeed() * deltaSeconds;

if (floorLayer) {
floorLayer.style.backgroundPosition = floorOffsetX.toFixed(2) + "px " + floorY;
}

if (wetLayer) {
wetLayer.style.backgroundPosition = wetOffsetX.toFixed(2) + "px " + wetY;
}
}

function resetFrameState() {
lastFrame = null;
firedThisLoop = {};
}

function startFrameMonitor() {
if (frameMonitor) return;

resetFrameState();
lastVisualTime = performance.now();

function tick(now) {
var deltaSeconds = Math.max(0, Math.min(0.1, (now - lastVisualTime) / 1000));
lastVisualTime = now;

updateMovingImagePositions(deltaSeconds);
updateAnimationCanvas(now);

if (animationVideo && animationVideo.src && animationVideo.style.display !== "none") {
var currentFrame = getCurrentVideoFrame();
var looped = false;

if (lastFrame !== null && currentFrame < lastFrame) {
looped = true;
firedThisLoop = {};
}

if (isAudioArmed) {
getTriggerFrames().forEach(function (targetFrame) {
if (!firedThisLoop[targetFrame] && crossedFrame(targetFrame, lastFrame, currentFrame, looped)) {
firedThisLoop[targetFrame] = true;
playFootstepOnce();
}
});
}

lastFrame = currentFrame;
}

frameMonitor = requestAnimationFrame(tick);
}

frameMonitor = requestAnimationFrame(tick);
}

function randomItem(list, group) {
if (!list || !list.length) return null;

if (list.length === 1) return list[0];

var picked = list[Math.floor(Math.random() * list.length)];

if (lastPlayed[group] && picked === lastPlayed[group]) {
picked = list[Math.floor(Math.random() * list.length)];
}

lastPlayed[group] = picked;
return picked;
}

function createAudioPool(urls, count) {
var result = [];

urls.forEach(function (url) {
for (var i = 0; i < count; i++) {
var audio = new Audio(url);
audio.preload = "auto";
result.push(audio);
}
});

return result;
}

function preparePools() {
Object.keys(soundLists).forEach(function (key) {
pools[key] = createAudioPool(soundLists[key], 3);
});
}

function sameUrl(audio, url) {
var encoded = url.replace(/ /g, "%20");
return audio.src.indexOf(encoded) !== -1;
}

function getAudioFromPool(url, group) {
var pool = pools[group] || [];

for (var i = 0; i < pool.length; i++) {
if (sameUrl(pool[i], url) && pool[i].paused) {
return pool[i];
}
}

var audio = new Audio(url);
audio.preload = "auto";
pool.push(audio);
pools[group] = pool;
return audio;
}

function playClip(url, group, volume, pitch) {
if (!url || volume <= 0) return;

var audio = getAudioFromPool(url, group);

try {
audio.pause();
audio.currentTime = 0;
audio.volume = clamp(volume, 0, 1);
audio.playbackRate = clamp(pitch || 1, 0.25, 4);
audio.preservesPitch = false;
audio.mozPreservesPitch = false;
audio.webkitPreservesPitch = false;
audio.play().catch(function () {});
} catch (error) {}
}

function playFootstepOnce() {
var sliderVolume = parseFloat(volumeSlider.value) || 0;
var wetness = parseFloat(wetnessSlider.value) || 0;

if (sliderVolume <= 0) return;

var surfaceList = soundLists[currentSurface] || soundLists.wood;
var footstepUrl = randomItem(surfaceList, currentSurface);
var footstepVolume = sliderVolume * getFootstepSpeedVolume();

playClip(footstepUrl, currentSurface, footstepVolume, getFootstepPitch());

if (wetness > 0 && Math.random() <= getWetChance()) {
var wetUrl = randomItem(soundLists.wet, "wet");
var wetBaseGain = dataNumber("wetVolumeMultiplier", 0.85);
var wetVolume = sliderVolume * wetBaseGain * getWetSpeedVolume();

playClip(wetUrl, "wet", wetVolume, getWetPitch());
}

if (currentSurface === "wood" && creakBox.checked && Math.random() <= getCreakChance()) {
var creakUrl = randomItem(soundLists.creak, "creak");
var creakBaseGain = dataNumber("creakVolumeMultiplier", 0.8);
var creakVolume = sliderVolume * creakBaseGain * getCreakSpeedVolume();
var delayMin = dataNumber("creakDelayMin", 0);
var delayMax = dataNumber("creakDelayMax", 0.08);
var delay = lerp(delayMin, delayMax, Math.random()) * 1000;

setTimeout(function () {
if (!isAudioArmed) return;
playClip(creakUrl, "creak", creakVolume, getCreakPitch());
}, delay);
}
}

function updateSlider(slider) {
var min = parseFloat(slider.min || "0");
var max = parseFloat(slider.max || "1");
var value = parseFloat(slider.value || "0");
var percent = 0;

if (max > min) {
percent = ((value - min) / (max - min)) * 100;
}

slider.style.setProperty("--dfp-fill-percent", percent + "%");
}

function updateUI() {
buttons.forEach(function (button) {
button.classList.toggle("dfp-active", button.dataset.surface === currentSurface);
});

root.classList.toggle("dfp-wood-selected", currentSurface === "wood");

volumeValue.textContent = Math.round((parseFloat(volumeSlider.value) || 0) * 100) + "%";
wetnessValue.textContent = Math.round((parseFloat(wetnessSlider.value) || 0) * 100) + "%";
speedValue.textContent = (parseFloat(speedSlider.value) || 1).toFixed(2) + "x";

updateSlider(volumeSlider);
updateSlider(wetnessSlider);
updateSlider(speedSlider);

updateBlackUnderlay();
updateAnimationTransform();
updateAnimationPresenterState();
updateFloorLayer();
updateWetLayer();
updateVideoPlaceholderState();
}

buttons.forEach(function (button) {
button.addEventListener("click", function () {
currentSurface = button.dataset.surface || "wood";
updateUI();
});
});

volumeSlider.addEventListener("input", function () {
var volume = parseFloat(volumeSlider.value) || 0;

isAudioArmed = volume > 0;
updateUI();
});

wetnessSlider.addEventListener("input", function () {
updateUI();
});

speedSlider.addEventListener("input", function () {
updateUI();
updateAnimationSpeed();
});

creakBox.addEventListener("change", function () {
updateUI();
});

if (animationVideo) {
animationVideo.addEventListener("loadedmetadata", function () {
resetFrameState();
updateAnimationSpeed();
drawAnimationCanvasFrame();

try {
var promise = animationVideo.play();

if (promise && promise.catch) {
promise.catch(function () {});
}
} catch (error) {}
});

animationVideo.addEventListener("play", function () {
resetFrameState();
});

animationVideo.addEventListener("seeked", function () {
resetFrameState();
drawAnimationCanvasFrame();
});
}

volumeSlider.value = root.dataset.defaultVolume || "0";
wetnessSlider.value = root.dataset.defaultWetness || "0";
speedSlider.value = root.dataset.defaultSpeed || "1";
speedSlider.min = root.dataset.speedMin || "0.5";
speedSlider.max = root.dataset.speedMax || "2";

preparePools();
setupAnimationVideo();
updateUI();

isAudioArmed = (parseFloat(volumeSlider.value) || 0) > 0;
startFrameMonitor();
});
})();
</script>
