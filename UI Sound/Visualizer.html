<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Real-Time Audio Visualizer</title>
<style>
:root {
  --pink: #a855f7;
}

* { box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  margin: 0 !important;
  padding: 0 !important;
  background: #0e0e0e !important;
  overflow: hidden !important;
}

/* Background Ambient Glow */
#ambient-visual {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background: radial-gradient(circle at 80% 20%, rgba(168, 85, 247, 0.18), transparent 60%);
  opacity: 0;
  transition: opacity 1.5s ease;
}

#ambient-visual.active {
  opacity: 1;
  animation: ambient-breathe 8s ease-in-out infinite;
}

@keyframes ambient-breathe {
  0% { transform: scale(1); }
  50% { transform: scale(1.05); }
  100% { transform: scale(1); }
}

/* Visualizer Canvas Container */
#pinkviz {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  width: 100vw;
  height: 40vh; /* Keeps it at the bottom 40% of the screen */
  background: transparent !important;
  overflow: hidden;
  z-index: 1;
  pointer-events: none;
}

#pinkviz canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

/* Audio Controls */
#audio-control {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}

#toggle-audio-button {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: 1.5px solid var(--pink);
  background: transparent;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding-right: 10px;
  position: relative;
  overflow: hidden;
  opacity: 0;
  pointer-events: none;
  filter: saturate(0);
  transition: opacity 3s ease, transform 0.15s ease, filter 1s ease;
}

#toggle-audio-button.visible {
  opacity: 1;
  pointer-events: auto;
}

#toggle-audio-button.playing {
  filter: saturate(1);
  animation: button-breathe 1.4s ease-in-out infinite;
  transform-origin: center;
}

#toggle-audio-button:active {
  transform: scale(0.92);
}

#toggle-audio-button.playing:active {
  animation-play-state: paused;
}

@keyframes button-breathe {
  0% { transform: scale(1); }
  35% { transform: scale(1.08); }
  65% { transform: scale(1.04); }
  100% { transform: scale(1); }
}

#toggle-audio-button svg {
  width: 18px;
  height: 18px;
  fill: none;
  stroke: var(--pink);
  stroke-width: 1.8;
}

#toggle-audio-button.playing::after {
  content: "";
  position: absolute;
  inset: -6px;
  border-radius: 50%;
  border: 1px solid var(--pink);
  opacity: 0;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0% { transform: scale(0.90); opacity: 0.40; }
  6% { opacity: 0.10; }
  8% { opacity: 0.38; }
  13% { opacity: 0.00; }
  15% { opacity: 0.30; }
  21% { opacity: 0.12; }
  24% { opacity: 0.28; }
  31% { opacity: 0.00; }
  33% { opacity: 0.22; }
  41% { opacity: 0.10; }
  44% { opacity: 0.20; }
  52% { opacity: 0.00; }
  55% { opacity: 0.16; }
  70% { transform: scale(1.40); opacity: 0.00; }
  100% { transform: scale(1.40); opacity: 0.00; }
}

#volume-wrap {
  position: relative;
  top: 36px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 3s ease, filter 1s ease, transform 0.3s ease;
  filter: saturate(0);
  display: flex;
  justify-content: center;
  align-items: center;
  width: 42px;
}

#volume-wrap.visible {
  opacity: 1;
  pointer-events: auto;
}

#volume-wrap.active {
  filter: saturate(1);
}

#volume-slider {
  -webkit-appearance: none;
  appearance: none;
  width: 120px;
  height: 42px;
  background: transparent;
  transform: rotate(-90deg);
  transform-origin: center;
  cursor: pointer;
}

#volume-slider::-webkit-slider-runnable-track {
  height: 4px;
  border-radius: 999px;
  background: linear-gradient(90deg, rgba(168, 85, 247, 0.18), rgba(168, 85, 247, 0.75));
  box-shadow: 0 0 10px rgba(168, 85, 247, 0.18), inset 0 0 8px rgba(168, 85, 247, 0.15);
}

#volume-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #120815;
  border: 1.5px solid var(--pink);
  margin-top: -5px;
  box-shadow: 0 0 10px rgba(168, 85, 247, 0.45), inset 0 0 6px rgba(168, 85, 247, 0.25);
  transition: transform 0.15s ease, box-shadow 0.2s ease;
}

#volume-slider::-webkit-slider-thumb:hover {
  transform: scale(1.12);
  box-shadow: 0 0 14px rgba(168, 85, 247, 0.65), inset 0 0 6px rgba(168, 85, 247, 0.25);
}
</style>
</head>
<body>

<div id="ambient-visual"></div>

<audio id="radio-stream" crossorigin="anonymous" loop muted playsinline></audio>

<div id="pinkviz"></div>

<div id="audio-control">
  <button id="toggle-audio-button" aria-label="Toggle music">
    <svg viewBox="0 0 24 24">
      <path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3z"/>
    </svg>
  </button>
  <div id="volume-wrap">
    <input id="volume-slider" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume control"/>
  </div>
</div>

<script>
// ==========================================
// AUDIO SYSTEM & WEB AUDIO API SETUP
// ==========================================
const audio = document.getElementById('radio-stream');
const button = document.getElementById('toggle-audio-button');
const ambient = document.getElementById('ambient-visual');
const volumeWrap = document.getElementById('volume-wrap');
const volumeSlider = document.getElementById('volume-slider');

let started = false;
let raf = null;
let isPlaying = false;
let targetVolume = parseFloat(volumeSlider.value);

// Web Audio API Variables
let audioCtx, analyser, dataArray;

function initWebAudio() {
  if (audioCtx) return; // Only init once
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 256; // Gives us 128 frequency bins
  analyser.smoothingTimeConstant = 0.8; // Smooths out the jumps naturally
  
  const source = audioCtx.createMediaElementSource(audio);
  source.connect(analyser);
  analyser.connect(audioCtx.destination);
  
  dataArray = new Uint8Array(analyser.frequencyBinCount);
}

function fadeAudioTo(target, duration) {
  cancelAnimationFrame(raf);
  const startVolume = audio.volume;
  const startTime = performance.now();

  if (target > 0) {
    audio.muted = false;
    isPlaying = true;
    button.classList.add('playing');
    ambient.classList.add('active');
    volumeWrap.classList.add('active');
  }

  function step(now) {
    const t = Math.min((now - startTime) / duration, 1);
    audio.volume = startVolume + (target - startVolume) * t;

    if (t < 1) {
      raf = requestAnimationFrame(step);
    } else if (target === 0) {
      audio.muted = true;
      isPlaying = false;
      button.classList.remove('playing');
      ambient.classList.remove('active');
      volumeWrap.classList.remove('active');
    }
  }
  raf = requestAnimationFrame(step);
}

function startAudio() {
  if (started) return;
  started = true;
  
  // Initialize Web Audio API on first user interaction
  initWebAudio();
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }

  audio.src = "https://msdysphoria.github.io/Personal-Storage/UI%20Sound/Gunship.mp3";
  audio.load();
  audio.volume = 0;
  audio.muted = false;

  audio.play().then(() => {
    fadeAudioTo(targetVolume, 3000);
    button.classList.add('visible');
    volumeWrap.classList.add('visible');
  }).catch(e => console.error("Audio playback failed:", e));
}

// User Interaction Listeners
window.addEventListener('click', startAudio, { once: true, capture: true });
window.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') startAudio();
}, { capture: true, once: true });

button.addEventListener('click', (e) => {
  e.stopPropagation();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  fadeAudioTo(isPlaying ? 0 : targetVolume, 1000);
});

volumeSlider.addEventListener('input', () => {
  targetVolume = parseFloat(volumeSlider.value);
  if (!started) return;

  if (targetVolume <= 0) {
    audio.volume = 0;
    audio.muted = true;
    isPlaying = false;
    button.classList.remove('playing');
    ambient.classList.remove('active');
    volumeWrap.classList.remove('active');
    return;
  }

  audio.muted = false;
  audio.volume = targetVolume;

  if (!isPlaying && !audio.paused) {
    isPlaying = true;
    button.classList.add('playing');
    ambient.classList.add('active');
    volumeWrap.classList.add('active');
  }
});

// ==========================================
// VISUALIZER SYSTEM
// ==========================================
const host = document.getElementById("pinkviz");
const c = document.createElement("canvas");
const ctx = c.getContext("2d", { alpha: true, desynchronized: true });
host.appendChild(c);

const P1 = [255, 111, 174];
const P2 = [255, 46, 147];

const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const irnd = (a, b) => Math.floor(rnd(a, b));
const dpr = () => Math.max(1, Math.min(2, window.devicePixelRatio || 1));

function resize() {
  const r = host.getBoundingClientRect();
  const s = dpr();
  c.width = Math.max(2, Math.floor(r.width * s));
  c.height = Math.max(2, Math.floor(r.height * s));
}
resize();
new ResizeObserver(resize).observe(host);

const bins = 64;
const phase = new Float32Array(bins);
const speed = new Float32Array(bins);
const base = new Float32Array(bins);

for (let i = 0; i < bins; i++) {
  phase[i] = Math.random() * Math.PI * 2;
  speed[i] = (0.8 + Math.random() * 1.6) * (0.6 + i / bins);
  base[i] = 0; // Starts flat
}

let energy = 0, target = 0, t0 = performance.now();
const FPS = 40;
const FRAME_TIME = 1000 / FPS;
let lastFrame = 0;

let glitchHold = 0;
let timeWarp = 1;
let warpTarget = 1;

function rgba(rgb, a) {
  return `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a})`;
}

function tick(now) {
  if (now - lastFrame < FRAME_TIME) {
    requestAnimationFrame(tick);
    return;
  }
  lastFrame = now;

  const rawDt = Math.min(0.04, (now - t0) / 1000);
  t0 = now;

  // --- Real Audio Analysis Update ---
  let currentAudioEnergy = 0;
  let bassEnergy = 0;

  if (analyser && isPlaying) {
    analyser.getByteFrequencyData(dataArray);
    
    // Calculate overall energy
    let sum = 0;
    for (let i = 0; i < bins; i++) {
      sum += dataArray[i];
    }
    currentAudioEnergy = (sum / bins) / 255;
    
    // Calculate heavy bass energy specifically for the glitch trigger
    let bassSum = 0;
    for (let i = 0; i < 6; i++) bassSum += dataArray[i];
    bassEnergy = bassSum / (6 * 255);
  } else {
    // Drop visuals to 0 if paused or stopped
    if (dataArray) dataArray.fill(0);
  }

  // Trigger Glitch ONLY on heavy bass drops instead of random math
  if (glitchHold <= 0 && bassEnergy > 0.88) {
    glitchHold = rnd(0.10, 0.30);
    warpTarget = rnd(0.55, 1.6);
  } else {
    glitchHold = Math.max(0, glitchHold - rawDt);
    if (glitchHold === 0) warpTarget = 1;
  }

  timeWarp = lerp(timeWarp, warpTarget, 0.06);

  // Set the target energy for the waves based on overall audio volume
  target = clamp(currentAudioEnergy * 1.5, 0.0, 1.0);
  energy = lerp(energy, target, 0.15);

  const W = c.width, H = c.height;

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = "source-over";
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.globalCompositeOperation = "lighter";

  const mid = H * 0.55;
  const amp = H * (0.10 + 0.30 * energy); // Wave reacts to audio energy

  // --- Draw Background Waves ---
  for (let k = 0; k < 3; k++) {
    const kk = k / 2;
    const col = kk < 0.5 ? P1 : P2;
    ctx.beginPath();
    const ph = now / 900 + kk * 1.6 + (glitchHold > 0 ? Math.sin(now / 35) * 0.3 : 0);
    const freq = 2.2 + kk * 1.8 + (glitchHold > 0 ? 0.6 : 0);

    for (let x = 0; x <= W; x += 6 * dpr()) {
      const u = x / W;
      const tear = (glitchHold > 0) ? (Math.sin(u * 40 + now / 33) * (H * 0.003 + H * 0.010 * energy) + (Math.random() - 0.5) * H * 0.0015) : 0;
      const y = mid + Math.sin(u * Math.PI * freq + ph) * amp + Math.sin(u * Math.PI * (freq * 0.6) - ph * 1.3) * amp * 0.45 * (0.35 + 0.65 * energy) + tear;
      if (x === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.lineWidth = (10 + 8 * energy) * dpr();
    ctx.strokeStyle = rgba(col, 0.12);
    ctx.shadowColor = rgba(col, 0.65);
    ctx.shadowBlur = (20 + 28 * energy) * dpr();
    ctx.stroke();
  }

  // --- Draw Audio Bars ---
  const padX = 18 * dpr(), padY = 22 * dpr();
  const usableW = W - padX * 2;
  const baseY = H - padY;
  const barW = usableW / bins;

  for (let i = 0; i < bins; i++) {
    const u = i / (bins - 1);
    
    // Grab exact frequency data for this bar (0 to 1)
    const audioVal = dataArray ? (dataArray[i] / 255.0) : 0;
    
    // Smooth the bar movement
    base[i] = lerp(base[i], audioVal, 0.25); 

    const ph = phase[i] + (now / 600) * speed[i] * timeWarp;
    const fall = Math.sin(u * Math.PI);
    const stomp = (glitchHold > 0 ? 1.25 : 1);

    // Height formula driven by REAL audio
    const h = H * (0.01 + 0.55 * base[i] * stomp) * (0.4 + 0.6 * fall);

    const x = padX + i * barW + barW * 0.15;
    const w = barW * 0.70;
    let y = baseY - h;

    if (glitchHold > 0 && Math.random() < 0.14) {
      y += (Math.random() < 0.5 ? -1 : 1) * rnd(0, H * 0.05) * (0.35 + 0.65 * energy);
    }

    const mix = u;
    const col = [
      Math.round(lerp(P1[0], P2[0], mix)),
      Math.round(lerp(P1[1], P2[1], mix)),
      Math.round(lerp(P1[2], P2[2], mix)),
    ];

    const r = Math.min(10 * dpr(), w / 2);
    ctx.shadowColor = rgba(col, 0.6);
    ctx.shadowBlur = (14 + 22 * energy) * dpr();
    ctx.fillStyle = rgba(col, 0.22 + 0.3 * energy);

    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.arcTo(x + w, baseY, x + w - r, baseY, r);
    ctx.arcTo(x, baseY, x, baseY - r, r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
    ctx.fill();
  }

  // --- Glitch Effect Overlays ---
  if (glitchHold > 0) {
    const slices = irnd(5, 12);
    for (let s = 0; s < slices; s++) {
      const sh = irnd(6, Math.max(10, H * 0.08));
      const sy = irnd(0, H - sh);
      const dx = irnd(-W * 0.03, W * 0.03);
      const sx = irnd(0, W * 0.02);
      ctx.drawImage(c, sx, sy, W - sx, sh, dx, sy, W - sx, sh);
    }
    ctx.save();
    ctx.globalCompositeOperation = "source-atop";
    const step = Math.max(2, Math.floor(3 * dpr()));
    for (let y = 0; y < H; y += step) {
      const col = (Math.random() < 0.5) ? P1 : P2;
      ctx.globalAlpha = (0.03 + 0.07 * Math.random()) * (0.25 + 0.75 * energy);
      ctx.fillStyle = rgba(col, 1);
      ctx.fillRect(0, y, W, 1 * dpr());
    }
    ctx.restore();
  }

  ctx.restore();
  requestAnimationFrame(tick);
}

requestAnimationFrame(tick);

</script>
</body>
</html>
