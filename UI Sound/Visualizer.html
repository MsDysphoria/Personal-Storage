<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Visualizer</title>

<style>
/* ---- HARD RESET (Carrd fights back otherwise) ---- */
* {
  box-sizing: border-box;
}

html, body {
  margin: 0 !important;
  padding: 0 !important;
  width: 100%;
  height: 100%;
  background: transparent !important;
  overflow: hidden !important;
}

/* Kill Carrd iframe defaults */
body::before,
body::after {
  display: none !important;
  content: none !important;
}

/* Root container */
#pinkviz {
  position: fixed;
  inset: 0;
  background: transparent !important;
  overflow: hidden;
}

/* Canvas */
canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  background: transparent !important;
  display: block;
}
</style>
</head>

<body>
<div id="pinkviz"></div>

<script>
(() => {
  const host = document.getElementById("pinkviz");
  const c = document.createElement("canvas");
  const ctx = c.getContext("2d", {
    alpha: true,
    desynchronized: true,
    willReadFrequently: false
  });
  host.appendChild(c);

  const P1 = [255,111,174];
  const P2 = [255,46,147];

  const lerp=(a,b,t)=>a+(b-a)*t;
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const rnd=(a,b)=>a+Math.random()*(b-a);
  const irnd=(a,b)=>Math.floor(rnd(a,b));
  const dpr=()=>Math.max(1,Math.min(2,window.devicePixelRatio||1));

  function resize(){
    const r = host.getBoundingClientRect();
    c.width = Math.max(2, Math.floor(r.width * dpr()));
    c.height = Math.max(2, Math.floor(r.height * dpr()));
  }
  resize();
  new ResizeObserver(resize).observe(host);

  const bins = 64;
  const phase = new Float32Array(bins);
  const speed = new Float32Array(bins);
  const base  = new Float32Array(bins);

  for (let i=0;i<bins;i++){
    phase[i]=Math.random()*Math.PI*2;
    speed[i]=(0.8+Math.random()*1.6)*(0.6+i/bins);
    base[i]=0.10+Math.random()*0.45;
  }

  let energy=0,target=0,t0=performance.now();
  let glitchHold=0, warpTarget=1, timeWarp=1;

  const rgba=(rgb,a)=>`rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a})`;

  function tick(now){
    const rawDt=Math.min(0.04,(now-t0)/1000);
    t0=now;

    if(glitchHold<=0 && Math.random()<0.018){
      glitchHold = rnd(0.12,0.28);
      warpTarget = rnd(0.6,1.4);
    } else {
      glitchHold = Math.max(0, glitchHold - rawDt);
      if(glitchHold===0) warpTarget = 1;
    }

    timeWarp = lerp(timeWarp, warpTarget, 0.05);

    const wander=0.55+0.45*Math.sin(now/1400)*Math.sin(now/2100);
    target=clamp(wander+(Math.random()-0.5)*0.08,0.10,1);
    energy=lerp(energy,target,0.06);

    const W=c.width,H=c.height;

    /* CRITICAL: clear to full transparency */
    ctx.setTransform(1,0,0,1,0,0);
    ctx.globalCompositeOperation="source-over";
    ctx.clearRect(0,0,W,H);

    ctx.save();
    ctx.globalCompositeOperation="lighter";

    const mid=H*0.55;
    const amp=H*(0.10+0.18*energy);

    /* Waves */
    for(let k=0;k<3;k++){
      const kk=k/2;
      const col=kk<0.5?P1:P2;
      ctx.beginPath();

      const ph=now/900+kk*1.6+(glitchHold>0?Math.sin(now/35)*0.3:0);
      const freq=2.2+kk*1.8+(glitchHold>0?0.6:0);

      for(let x=0;x<=W;x+=6*dpr()){
        const u=x/W;
        const tear=(glitchHold>0)
          ? Math.sin(u*40+now/33)*(H*0.006*energy)
          : 0;

        const y =
          mid
          + Math.sin(u*Math.PI*freq+ph)*amp
          + Math.sin(u*Math.PI*(freq*0.6)-ph*1.3)*amp*0.45*(0.35+0.65*energy)
          + tear;

        x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
      }

      ctx.lineWidth=(10+8*energy)*dpr();
      ctx.strokeStyle=rgba(col,0.12);
      ctx.shadowColor=rgba(col,0.65);
      ctx.shadowBlur=(20+28*energy)*dpr();
      ctx.stroke();
    }

    /* Bars */
    const padX=18*dpr(), padY=22*dpr();
    const baseY=H-padY;
    const barW=(W-padX*2)/bins;

    for(let i=0;i<bins;i++){
      const u=i/(bins-1);
      const ph=phase[i]+(now/600)*speed[i]*timeWarp;
      const wob=0.55+0.45*Math.sin(ph);
      const fall=Math.sin(u*Math.PI);

      const h=(H*(0.10+0.42*energy))*(base[i]+0.65*wob)*(0.35+0.65*fall);

      const x=padX+i*barW+barW*0.15;
      const w=barW*0.70;
      const y=baseY-h;

      const col=[
        Math.round(lerp(P1[0],P2[0],u)),
        Math.round(lerp(P1[1],P2[1],u)),
        Math.round(lerp(P1[2],P2[2],u))
      ];

      ctx.fillStyle=rgba(col,0.22+0.10*energy);
      ctx.shadowColor=rgba(col,0.6);
      ctx.shadowBlur=(14+22*energy)*dpr();

      ctx.beginPath();
      ctx.roundRect(x,y,w,h,Math.min(10*dpr(),w/2));
      ctx.fill();
    }

    /* GLITCH — alpha-safe, no background paint */
    if(glitchHold>0){
      ctx.globalCompositeOperation="source-atop";
      for(let y=0;y<H;y+=Math.max(2,3*dpr())){
        ctx.globalAlpha=(0.03+0.06*Math.random())*energy;
        ctx.fillStyle=rgba(Math.random()<0.5?P1:P2,1);
        ctx.fillRect(0,y,W,1*dpr());
      }
    }

    ctx.restore();
    requestAnimationFrame(tick);
  }

  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
